<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>点单小程序</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --primary:#07c160; --primary-d:#06ad56;
    --text:#222; --muted:#999; --line:#eee; --green:#07c160;
    --shadow:0 1px 8px rgba(0,0,0,.05); --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding-bottom:140px}

  /* ===== 顶部标题栏 ===== */
  .topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:center;gap:10px}
  .topbar h1{font-size:18px;font-weight:600;color:#222}
  .topbar .tb-icon{font-size:20px}

  /* ===== 左侧分类导航 + 右侧商品区（点单页专用） ===== */
  .order-layout{display:flex;gap:0;min-height:calc(100vh - 120px)}
  .cat-nav{width:90px;flex-shrink:0;background:#f7f7f7;overflow-y:auto;position:sticky;top:53px;height:calc(100vh - 120px)}
  .cat-item{display:block;padding:16px 10px;text-align:center;font-size:14px;color:#666;cursor:pointer;border-left:3px solid transparent;transition:.2s;line-height:1.4}
  .cat-item:hover{background:#efefef}
  .cat-item.active{background:#fff;color:var(--primary);font-weight:600;border-left-color:var(--primary)}

  .product-area{flex:1;min-width:0;padding:12px 16px}
  .sec-title{font-size:15px;font-weight:600;padding:14px 4px 10px;color:#333}

  /* 商品行：左图 右信息 横向排列 */
  .plist{display:flex;flex-direction:column}
  .prow{display:flex;align-items:center;gap:14px;background:#fff;padding:12px;border-radius:var(--radius);margin-bottom:10px;transition:.2s}
  .prow:hover{box-shadow:var(--shadow)}
  .prow .rw-img{width:88px;height:88px;border-radius:10px;object-fit:cover;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden}
  .prow .rw-img img{width:100%;height:100%;object-fit:cover}
  .prow .rw-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .prow .rw-name{font-size:15px;font-weight:600}
  .prow .rw-desc{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prow .rw-price{font-size:15px;color:var(--primary);font-weight:700}
  .prow .rw-stock{font-size:11px;margin-top:2px}
  .prow .rw-stock.ok{color:var(--muted)}
  .prow .rw-stock.warn{color:#e67e22;font-weight:600}
  .prow .rw-stock.out{color:#e74c3c;font-weight:700}
  .prow .rw-btns{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .prow.soldout{opacity:.65}
  /* 绿色主按钮 */
  .btn-green{padding:9px 20px;border:none;border-radius:22px;font-size:13px;font-weight:600;cursor:pointer;background:var(--primary);color:#fff;transition:.2s;white-space:nowrap}
  .btn-green:hover{background:var(--primary-d)}
  .btn-green:disabled{background:#ccc;cursor:not-allowed}
  .btn-del{padding:6px 14px;border:none;border-radius:16px;font-size:12px;cursor:pointer;background:#fef0f0;color:#e74c3c;font-weight:600;transition:.2s}
  .btn-del:hover{background:#fde2e2}
  /* 数量调节 */
  .qty-row{display:flex;align-items:center;gap:8px}
  .qty-row button{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#555;transition:.15s}
  .qty-row button:hover{border-color:var(--primary);color:var(--primary)}
  .qty-row .q-num{min-width:24px;text-align:center;font-weight:700;font-size:15px}

  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  /* 页面 */
  .page{display:none}
  .page.active{display:block}
  /* 表单 */
  .panel{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
  .panel h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .panel h2::before{content:"";width:4px;height:16px;background:var(--primary);border-radius:2px;display:inline-block}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13px;color:var(--muted)}
  .field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;outline:none;transition:.2s}
  .field input:focus,.field select:focus{border-color:var(--primary)}
  .file-btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;padding:10px;border:1.5px dashed var(--primary);color:var(--primary);border-radius:9px;cursor:pointer;font-size:13px;background:#f0faf5}
  .file-btn input{display:none}
  .btn{padding:11px 22px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;transition:.2s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover{background:var(--primary-d)}
  .btn-ghost{background:#f0f0f0;color:#555}
  .form-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  /* 购物车底部栏 */
  .cartbar{position:fixed;left:0;right:0;bottom:56px;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.08);padding:12px 18px;display:none;align-items:center;gap:14px;z-index:40}
  .cartbar.show{display:flex}
  .cartbar .info{flex:1}
  .cartbar .info .cnt{font-size:13px;color:var(--muted)}
  .cartbar .info .total{font-size:20px;font-weight:700;color:var(--primary)}
  .cartbar .info .total small{font-size:12px;color:var(--muted);font-weight:400}
  .cartbar .btns{display:flex;gap:10px}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px}
  /* 底部导航栏 */
  .tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;height:56px;z-index:45;box-shadow:0 -2px 8px rgba(0,0,0,.04)}
  .tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:12px;color:var(--muted);transition:.2s;background:none;border:none;outline:none}
  .tabbar .tab .icon{font-size:18px;line-height:1}
  .tabbar .tab.active{color:var(--primary);font-weight:600}
  /* 订单弹窗 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
  .modal.show{display:flex}
  .modal-box{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:85vh;overflow:auto;padding:22px}
  .modal-box h3{font-size:18px;margin-bottom:14px}
  .order-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .order-sum{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:14px 0;color:var(--primary)}
  .order-meta{font-size:12px;color:var(--muted);margin-bottom:14px}
  .modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .modal-actions .btn{flex:1;min-width:110px}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:99}
  .toast.show{opacity:1}
  /* 小票 */
  .receipt{border:1px dashed var(--line);border-radius:10px;padding:14px;margin:4px 0 14px;background:#fff}
  /* 历史订单 */
  .today-bar{display:flex;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,#07c160,#06ad56);color:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .today-bar .tb{flex:1;min-width:120px}
  .today-bar .tb .n{font-size:24px;font-weight:700}
  .today-bar .tb .l{font-size:12px;opacity:.92}
  .hist-list{display:flex;flex-direction:column;gap:10px}
  .hist-item{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .hist-item .hi-l .hi-time{font-size:12px;color:var(--muted)}
  .hist-item .hi-l .hi-no{font-size:11px;color:var(--muted);margin-top:2px}
  .hist-item .hi-l .hi-items{font-size:13px;margin-top:6px;line-height:1.6}
  .hist-item .hi-r{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .hist-item .hi-r .hi-total{font-size:18px;font-weight:700;color:var(--primary)}
  .hist-item .hi-r button{padding:6px 14px;font-size:12px;border:none;border-radius:8px;cursor:pointer;background:#f0f0f0;color:#555}
  .hist-item .hi-r .exp{background:var(--primary);color:#fff}
  .compressing{font-size:12px;color:var(--primary);margin-top:6px;min-height:16px}
  /* 筛选条 */
  .hist-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .hist-toolbar .field{display:flex;align-items:center;gap:8px}
  .hist-toolbar label{font-size:13px;color:var(--muted)}
  .hist-toolbar input[type=date]{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;outline:none}
  .hist-toolbar input[type=date]:focus{border-color:var(--primary)}
  .hist-toolbar .btn{padding:8px 16px;font-size:13px}
  .hist-toolbar .spacer{flex:1}
  /* 月度汇总 */
  .month-bar{display:flex;gap:14px;flex-wrap:wrap;background:linear-gradient(135deg,#5b6ef5,#7b5bf5);color:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
  .month-bar .mb{flex:1;min-width:120px}
  .month-bar .mb .n{font-size:24px;font-weight:700}
  .month-bar .mb .l{font-size:12px;opacity:.92}
  .rank-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .rank-item{display:flex;align-items:center;gap:10px;font-size:13px}
  .rank-item .rk{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .rank-item .rk.g{background:#bbb}
  .rank-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-item .bar{height:8px;background:#eef;flex-shrink:0;border-radius:4px;min-width:4px}
  .rank-item .val{width:88px;text-align:right;color:var(--muted);flex-shrink:0}
  .months-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:6px}
  .month-card{background:#fafaff;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.2s}
  .month-card:hover{border-color:var(--primary);transform:translateY(-2px)}
  .month-card.active{border-color:var(--primary);background:#f0faf5}
  .month-card .mc-m{font-weight:700;font-size:15px}
  .month-card .mc-s{font-size:12px;color:var(--muted);margin-top:4px}
  .month-card .mc-t{color:var(--primary);font-weight:700;margin-top:6px}
  /* 数据备份 */
  .backup-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px dashed var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:18px}
  .backup-bar .bk-tip{font-size:12px;color:var(--muted);flex:1;min-width:160px}
  .backup-bar .btn{padding:9px 18px;font-size:13px}
  .backup-bar input[type=file]{display:none}
  /* 店铺切换 */
  .shop-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:18px;box-shadow:var(--shadow)}
  .shop-bar .shop-tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1}
  .shop-tab{padding:7px 16px;border:1px solid var(--line);border-radius:20px;font-size:13px;cursor:pointer;background:#fafafa;transition:.2s;display:flex;align-items:center;gap:6px}
  .shop-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .shop-tab .x{font-size:12px;opacity:.7;cursor:pointer}
  .shop-tab .x:hover{opacity:1}
  .shop-bar .btn{padding:8px 16px;font-size:13px}
  .receipt .r-head{text-align:center;border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px}
  .receipt .r-head .title{font-weight:700;font-size:16px}
  .receipt .r-head .meta{font-size:11px;color:var(--muted);margin-top:4px}
  .receipt .r-item{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
  .receipt .r-item .nm{flex:1}
  .receipt .r-item .qt{color:var(--muted);margin:0 10px}
  .receipt .r-sum{display:flex;justify-content:space-between;font-weight:700;font-size:15px;border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
  /* 菜品管理列表 */
  .dish-list{display:flex;flex-direction:column;gap:10px}
  .dish-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
  .dish-item .di-img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
  .dish-item .di-img img{width:100%;height:100%;object-fit:cover}
  .dish-item .di-info{flex:1;min-width:0}
  .dish-item .di-name{font-weight:600;font-size:14px}
  .dish-item .di-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .dish-item .di-stock{font-size:12px;margin-top:2px}
  .dish-item .di-ops{display:flex;gap:6px;flex-shrink:0}
  .dish-item .di-ops button{padding:6px 12px;border:none;border-radius:8px;font-size:12px;cursor:pointer;font-weight:600}
  .dish-item .di-edit{background:#e8f0ff;color:#3498db}
  .dish-item .di-del{background:#fef0f0;color:#e74c3c}
  /* 打印样式 */
  @media print{
    body *{visibility:hidden}
    #printArea,#printArea *{visibility:visible}
    #printArea{position:absolute;left:0;top:0;width:100%;padding:10px}
    .cartbar,.tabbar,.topbar,.wrap,.modal-actions,.toast,.order-layout{display:none!important}
    .receipt{border:none}
  }

  /* ===== 响应式：手机端分类变横向滚动 ===== */
  @media (max-width: 640px){
    .order-layout{flex-direction:column}
    .cat-nav{width:100%;height:auto;position:relative;top:0;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 12px;gap:4px;background:#fff;border-bottom:1px solid var(--line)}
    .cat-item{flex-shrink:0;padding:8px 16px;border-left:none;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;font-size:13px}
    .cat-item.active{background:#f0faf5;border-bottom-color:var(--primary)}
    .product-area{padding:10px 12px}
    .prow .rw-img{width:72px;height:72px}
    .prow .rw-name{font-size:14px}
    .prow .rw-price{font-size:14px}
    .btn-green{padding:7px 14px;font-size:12px}
  }
</style>
</head>
<body>

<!-- 顶部标题栏 -->
<div class="topbar">
  <span class="tb-icon">🏠</span>
  <h1>点单小程序</h1>
</div>

<div class="wrap">

  <!-- 店铺切换（共享） -->
  <div class="shop-bar" id="shopBarOuter">
    <div class="shop-tabs" id="shopTabs"></div>
    <button class="btn btn-ghost" onclick="addShop()">+ 新店铺</button>
  </div>

  <!-- ============ 点单页（左右布局） ============ -->
  <div class="page active" id="page-order">
    <div class="order-layout" id="orderLayout">
      <!-- 左侧分类 -->
      <nav class="cat-nav" id="catNav"></nav>
      <!-- 右侧商品列表 -->
      <div class="product-area" id="productArea"></div>
    </div>
    <div class="empty" id="emptyTip" style="display:none">还没有商品，先在「菜品」页添加吧～</div>
  </div>

  <!-- ============ 菜品页 ============ -->
  <div class="page" id="page-dishes">
    <!-- 添加商品表单 -->
    <div class="panel">
      <h2>添加商品</h2>
      <div class="grid">
        <div class="field">
          <label>商品图片</label>
          <label class="file-btn">📷 选择图片
            <input type="file" id="pImg" accept="image/*" onchange="handleImg(this)">
          </label>
          <div class="compressing" id="compressTip"></div>
        </div>
        <div class="field">
          <label>商品名称</label>
          <input type="text" id="pName" placeholder="如：招牌牛肉面">
        </div>
        <div class="field">
          <label>种类</label>
          <input type="text" id="pCat" list="catList" placeholder="如：主食 / 饮品">
          <datalist id="catList"></datalist>
        </div>
        <div class="field">
          <label>价格（元）</label>
          <input type="number" id="pPrice" min="0" step="0.01" placeholder="0.00">
        </div>
        <div class="field">
          <label>库存（份，留空=不限制）</label>
          <input type="number" id="pStock" min="0" step="1" placeholder="如：50">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" onclick="addProduct()">+ 加入菜单</button>
        <button class="btn btn-ghost" onclick="clearProducts()">清空菜单</button>
      </div>
    </div>

    <!-- 已添加菜品列表 -->
    <div class="panel">
      <h2>已添加菜品</h2>
      <div class="dish-list" id="dishList"></div>
      <div class="empty" id="dishEmpty" style="display:none">还没有添加菜品～</div>
    </div>
  </div>

  <!-- ============ 报表页 ============ -->
  <div class="page" id="page-report">
    <!-- 今日营业统计条 -->
    <div class="today-bar">
      <div class="tb"><div class="n" id="todayOrders">0</div><div class="l">今日订单数</div></div>
      <div class="tb"><div class="n" id="todaySales">¥0.00</div><div class="l">今日营业额</div></div>
      <div class="tb"><div class="n" id="allOrders">0</div><div class="l">历史总订单</div></div>
      <div class="tb"><div class="n" id="allSales">¥0.00</div><div class="l">历史总营业额</div></div>
    </div>

    <!-- 历史订单 -->
    <div class="panel">
      <h2>历史订单</h2>
      <div class="hist-toolbar">
        <div class="field">
          <label>日期</label>
          <input type="date" id="filterDate" onchange="renderHistory()">
        </div>
        <button class="btn btn-ghost" onclick="clearDateFilter()">全部日期</button>
        <div class="spacer"></div>
        <span class="cnt" id="filterCount" style="font-size:13px;color:var(--muted)"></span>
        <button class="btn btn-primary" onclick="exportCSV()">⬇ 导出全部 CSV</button>
      </div>
      <div class="hist-list" id="histList"></div>
      <div class="empty" id="histEmpty">还没有提交过订单～</div>
    </div>

    <!-- 月度汇总 -->
    <div class="panel">
      <h2>月度汇总</h2>
      <div class="month-bar">
        <div class="mb"><div class="n" id="mOrders">0</div><div class="l">当前月订单</div></div>
        <div class="mb"><div class="n" id="mSales">¥0.00</div><div class="l">当前月营业额</div></div>
        <div class="mb"><div class="n" id="mAvg">¥0.00</div><div class="l">月日均营业额</div></div>
        <div class="mb"><div class="n" id="mBest">—</div><div class="l">最畅销商品</div></div>
      </div>
      <div class="months-grid" id="monthsGrid"></div>
      <div style="margin-top:14px;font-size:14px;font-weight:600">🏆 当月商品排行（按销售额）</div>
      <div class="rank-list" id="rankList"></div>
      <div class="empty" id="monthEmpty" style="display:none">暂无订单数据～</div>
    </div>

    <!-- 数据备份 -->
    <div class="panel">
      <h2>数据备份与恢复</h2>
      <div class="backup-bar">
        <span class="bk-tip">将菜单与历史订单打包成一份 JSON，可存档或迁移到其他设备；导入会覆盖当前本地数据。</span>
        <button class="btn btn-ghost" onclick="exportBackup()">⬇ 导出备份</button>
        <label class="btn btn-primary" style="cursor:pointer">⬆ 导入恢复
          <input type="file" id="backupFile" accept="application/json,.json" onchange="importBackup(this)">
        </label>
      </div>
    </div>
  </div>

</div>

<!-- 购物车底部栏（仅点单页显示） -->
<div class="cartbar show" id="cartbar">

  </div>
  <div class="btns">
    <button class="btn btn-ghost" onclick="clearCart()">清空</button>
    <button class="btn btn-primary" onclick="submitOrder()">提交订单</button>

<div class="tabbar" id="tabbar">
  <button class="tab active" data-page="order" onclick="switchPage('order')">
    <span class="icon">🍽️</span><span>点单</span>
  </button>
  <button class="tab" data-page="dishes" onclick="switchPage('dishes')">

<!-- 订单弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3>✅ 订单提交成功</h3>
    <div class="order-meta" id="orderMeta"></div>
    <div class="receipt" id="printArea">
      <div class="r-head">
        <div class="title" id="rTitle">点单小程序</div>
        <div class="meta" id="orderMeta2"></div>
      </div>
      <div id="orderList"></div>
      <div class="r-sum"><span>合计</span><span>¥<span id="orderTotal">0.00</span></span></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">关闭</button>
      <button class="btn btn-primary" onclick="printReceipt()">🖨 打印小票</button>
      <button class="btn btn-ghost" onclick="exportOrder()">⬇ 导出订单</button>
      <button class="btn btn-primary" onclick="newOrder()">再来一单</button>
    </div>
  </div>
</div>

<div id="printOnly" style="display:none"></div>
<div class="toast" id="toast"></div>

<script>
let shops = [];
let curShopId = '';
let products = [];
let orders = [];
let cart = {};
let curFilter = '全部';
let curPage = 'order';
let lastOrder = null;
const LS_SHOPS = 'order_app_shops_v2';
const LS_CUR = 'order_app_curshop_v1';

function curShop(){ return shops.find(s=>s.id===curShopId) || shops[0]; }
function saveShops(){
  try{ localStorage.setItem(LS_SHOPS, JSON.stringify(shops)); }
  catch(e){ console.warn('保存失败', e); toast('保存失败：数据过大'); }
}
function loadShops(){
  try{
    const raw=localStorage.getItem(LS_SHOPS);
    if(raw){ shops=JSON.parse(raw); }
    else{
      let oldP=[], oldO=[];
      try{ const p=localStorage.getItem('order_app_products_v1'); if(p) oldP=JSON.parse(p); }catch(e){}
      try{ const o=localStorage.getItem('order_app_orders_v1'); if(o) oldO=JSON.parse(o); }catch(e){}
      if(oldP.length||oldO.length){
        shops=[{id:'shop_default', name:'总店', products:oldP, orders:oldO}];
        saveShops();
      }
    }
  }catch(e){ console.warn('读取店铺失败', e); }
  if(!shops.length){ shops=[{id:'shop_'+Date.now(), name:'总店', products:[], orders:[]}]; }
  const cid=localStorage.getItem(LS_CUR);
  curShopId=(cid && shops.find(s=>s.id===cid))?cid:shops[0].id;
  syncCur();
}
function syncCur(){
  const s=curShop();
  products=s.products; orders=s.orders;
}
function saveProducts(){ const s=curShop(); s.products=products; saveShops(); }
function saveOrders(){ const s=curShop(); s.orders=orders; saveShops(); }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}

function fmt(n){ return n.toFixed(2); }

// ========== 页面切换 ==========
function switchPage(name){
  curPage=name;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const target=document.getElementById('page-'+name);
  if(target) target.classList.add('active');
  document.querySelectorAll('.tabbar .tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.page===name);
  });
  const cartbar=document.getElementById('cartbar');
  cartbar.classList.toggle('show', name==='order');
  // 点单页显示店铺栏，其他页隐藏
  document.getElementById('shopBarOuter').style.display=(name==='order'?'':'none');
  if(name==='order') render();
  else if(name==='dishes') renderDishes();
  else if(name==='report') renderReport();
}

// ========== 图片压缩 ==========
function compressImage(file){
  return new Promise((resolve)=>{
    const MAX1=1*1024*1024, MAX2=2*1024*1024;
    const tip=document.getElementById('compressTip');
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const tryCompress=(maxBytes)=>{
          let w=img.width, h=img.height;
          const LONG=1600;
          if(Math.max(w,h)>LONG){ const r=LONG/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
          const canvas=document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          let q=0.92;
          let out=canvas.toDataURL('image/jpeg',q);
          while(out.length>maxBytes && q>0.3){
            q-=0.08;
            out=canvas.toDataURL('image/jpeg',q);
          }
          return {out,size:out.length};
        };
        const raw=img.src.length;
        if(raw<=MAX1){ tip.textContent='原图已满足大小'; resolve(img.src); return; }
        let r1=tryCompress(MAX1);
        if(r1.size<=MAX1){ tip.textContent=`压缩至 ${(r1.size/1024/1024).toFixed(2)}MB`; resolve(r1.out); return; }
        let r2=tryCompress(MAX2);
        tip.textContent=`压缩至 ${(r2.size/1024/1024).toFixed(2)}MB`;
        resolve(r2.out);
      };
      img.onerror=()=>{ tip.textContent='图片读取失败'; resolve(''); };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
let pendingImg='';
async function handleImg(input){
  const tip=document.getElementById('compressTip');
  const file=input.files[0];
  if(!file){ pendingImg=''; tip.textContent=''; return; }
  tip.textContent='压缩中…';
  pendingImg=await compressImage(file);
}

function isToday(ts){
  const d=new Date(ts), n=new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

// ========== 商品管理 ==========
function addProduct(){
  const name=document.getElementById('pName').value.trim();
  const cat=document.getElementById('pCat').value.trim()||'其他';
  const price=parseFloat(document.getElementById('pPrice').value);
  const stockRaw=document.getElementById('pStock').value.trim();
  const stock=stockRaw===''?null:parseInt(stockRaw,10);
  if(!name){ toast('请填写商品名称'); return; }
  if(isNaN(price)||price<0){ toast('请填写有效价格'); return; }
  if(stock!==null && (isNaN(stock)||stock<0)){ toast('请填写有效库存'); return; }
  const p={id:Date.now()+''+Math.floor(Math.random()*1000),name,cat,price,stock,img:pendingImg||''};
  pendingImg='';
  document.getElementById('compressTip').textContent='';
  finishAdd(p);
}
function finishAdd(p){
  products.push(p);
  saveProducts();
  document.getElementById('pName').value='';
  document.getElementById('pCat').value='';
  document.getElementById('pPrice').value='';
  document.getElementById('pStock').value='';
  document.getElementById('pImg').value='';
  renderDishes();
  toast('已添加：'+p.name);
}

function clearProducts(){
  if(!products.length) return;
  if(confirm('确定清空【'+curShop().name+'】的所有商品？')){
    products=[]; cart={}; saveProducts(); renderDishes(); toast('菜单已清空');
  }
}

function changeQty(id,d){
  const p=products.find(x=>x.id===id);
  let q=(cart[id]||0)+d;
  if(q<=0){ delete cart[id]; render(); return; }
  if(p && p.stock!==null && q>p.stock){ toast('「'+p.name+'」库存仅剩 '+p.stock+' 份'); return; }
  cart[id]=q;
  render();
}

function removeProduct(id){
  products=products.filter(p=>p.id!==id);
  delete cart[id];
  saveProducts();
  render();
  renderDishes();
}

function removeFromCart(id){
  delete cart[id];
  render();
}

function editStock(id){
  const p=products.find(x=>x.id===id);
  if(!p) return;
  const cur=p.stock===null?'':p.stock;
  const raw=prompt('修改「'+p.name+'」的库存：\n（输入数字设置库存，留空=不限制）', cur);
  if(raw===null) return;
  if(raw.trim()===''){ p.stock=null; }
  else{ const n=parseInt(raw,10); if(isNaN(n)||n<0){ toast('请输入有效数字'); return; } p.stock=n; }
  saveProducts();
  renderDishes();
  toast('库存已更新');
}

function clearCart(){ cart={}; render(); toast('购物车已清空'); }

// ========== 渲染：点单页（参考图风格） ==========
function render(){
  // 店铺标签
  const st=document.getElementById('shopTabs');
  st.innerHTML=shops.map(s=>`<span class="shop-tab ${s.id===curShopId?'active':''}" onclick="switchShop('${s.id}')">
    🏪 ${s.name}${shops.length>1?`<span class="x" onclick="event.stopPropagation();delShop('${s.id}')">✕</span>`:''}
  </span>`).join('');

  // 分类
  const cats=['全部',...new Set(products.map(p=>p.cat))];
  // 左侧导航
  const navEl=document.getElementById('catNav');
  navEl.innerHTML=cats.map(c=>`<a class="cat-item ${c===curFilter?'active':''}" onclick="setFilter('${c}')">${c}</a>`).join('');
  // datalist
  document.getElementById('catList').innerHTML=cats.filter(c=>c!=='全部').map(c=>`<option value="${c}">`).join('');

  // 商品列表
  const list=products.filter(p=>curFilter==='全部'||p.cat===curFilter);
  const area=document.getElementById('productArea');
  const empty=document.getElementById('emptyTip');
  const layout=document.getElementById('orderLayout');

  if(!products.length){
    layout.style.display='none'; empty.style.display='block'; empty.textContent='还没有商品，先在「菜品」页添加吧～'; return;
  }
  layout.style.display='flex';
  if(!list.length){ area.innerHTML='<div style="color:var(--muted);padding:30px 0;text-align:center">该种类下暂无商品</div>'; return; }
  empty.style.display='none';

  // 按分类分组渲染
  const groups={};
  list.forEach(p=>{
    if(!groups[p.cat]) groups[p.cat]=[];
    groups[p.cat].push(p);
  });

  let html='';
  Object.keys(groups).forEach(cat=>{
    html+=`<div class="sec-title">${cat}</div>`;
    groups[cat].forEach(p=>{
      const q=cart[p.id]||0;
      const imgHtml=p.img
        ? `<div class="rw-img"><img src="${p.img}" alt="${p.name}"></div>`
        : `<div class="rw-img">🍽️</div>`;
      // 库存
      let stockCls='ok',stockTxt='';
      if(p.stock===null){ stockTxt='库存不限'; }
      else if(p.stock<=0){ stockCls='out'; stockTxt='已售罄'; }
      else if(p.stock<=5){ stockCls='warn'; stockTxt=`仅剩 ${p.stock} 份`; }
      else { stockTxt=`库存 ${p.stock}`; }

      // 操作按钮
      let btnHtml='';
      if(p.stock!==null && p.stock<=0){
        btnHtml=`<button class="btn-green" disabled>已售罄</button>`;
      }else if(q>0){
        btnHtml=`<div class="qty-row">
          <button onclick="changeQty('${p.id}',-1)">−</button>
          <span class="q-num">${q}</span>
          <button onclick="changeQty('${p.id}',1)">+</button>
        </div>
        <button class="btn-del" onclick="removeFromCart('${p.id}')">移除</button>`;
      }else{
        btnHtml=`<button class="btn-green" onclick="changeQty('${p.id}',1)">选规格</button>`;
      }

      html+=`<div class="prow ${p.stock!==null&&p.stock<=0?'soldout':''}">
        ${imgHtml}
        <div class="rw-info">
          <div class="rw-name">${p.name}</div>
          <div class="rw-desc">${p.cat} · ${stockTxt}</div>
          <div class="rw-price">¥${fmt(p.price)}</div>
        </div>
        <div class="rw-btns">${btnHtml}</div>
      </div>`;
    });
  });
  area.innerHTML=html;

  updateStats();
  renderHistory();
}

function setFilter(c){ curFilter=c; render(); }

function updateStats(){
  const cnt=Object.values(cart).reduce((a,b)=>a+b,0);
  const total=Object.entries(cart).reduce((s,[id,q])=>{
    const p=products.find(x=>x.id===id); return s+(p?p.price*q:0);
  },0);
  document.getElementById('cartCnt').textContent='购物车：'+cnt+' 件';
  document.getElementById('cartTotal').textContent=fmt(total);
}

// ========== 渲染：菜品页 ==========
function renderDishes(){
  const list=document.getElementById('dishList');
  const empty=document.getElementById('dishEmpty');
  if(!products.length){ empty.style.display='block'; list.innerHTML=''; return; }
  empty.style.display='none';
  list.innerHTML=products.map(p=>{
    const img=p.img?`<div class="di-img"><img src="${p.img}" alt="${p.name}"></div>`:`<div class="di-img">🍽️</div>`;
    let stockTxt;
    if(p.stock===null) stockTxt='库存：不限';
    else if(p.stock<=0) stockTxt='<span style="color:#e74c3c;font-weight:600">已售罄</span>';
    else if(p.stock<=5) stockTxt='<span style="color:#e67e22;font-weight:600">库存紧张：仅 '+p.stock+' 份</span>';
    else stockTxt='库存：'+p.stock+' 份';
    return `<div class="dish-item">
      ${img}
      <div class="di-info">
        <div class="di-name">${p.name}</div>
        <div class="di-meta">[${p.cat}] ¥${fmt(p.price)}/份</div>
        <div class="di-stock">${stockTxt}</div>
      </div>
      <div class="di-ops">
        <button class="di-edit" onclick="editStock('${p.id}')">改库存</button>
        <button class="di-del" onclick="removeProduct('${p.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
}

// ========== 下单 ==========
function submitOrder(){
  const items=Object.entries(cart).map(([id,q])=>{
    const p=products.find(x=>x.id===id);
    return {name:p.name,cat:p.cat,price:p.price,qty:q,sub:p.price*q};
  });
  if(!items.length){ toast('购物车是空的'); return; }
  const total=items.reduce((s,i)=>s+i.sub,0);
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const bj=`${now.getFullYear()}年${pad(now.getMonth()+1)}月${pad(now.getDate())}日 ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const orderNo=now.getTime();
  lastOrder={time:bj, orderNo, items, total};
  document.getElementById('orderMeta').textContent='下单时间：'+bj;
  document.getElementById('orderMeta2').textContent='订单号：'+orderNo+'　'+bj;
  document.getElementById('orderList').innerHTML=items.map(i=>
    `<div class="r-item"><span class="nm">${i.name} <small style="color:#888">[${i.cat}]</small></span><span class="qt">×${i.qty}</span><span>¥${fmt(i.sub)}</span></div>`
  ).join('');
  document.getElementById('orderTotal').textContent=fmt(total);
  document.getElementById('modal').classList.add('show');
  Object.entries(cart).forEach(([id,q])=>{
    const p=products.find(x=>x.id===id);
    if(p && p.stock!==null){ p.stock=Math.max(0,p.stock-q); }
  });
  orders.unshift({time:bj, ts:orderNo, orderNo, items, total});
  saveProducts(); saveOrders();
}

// ========== 报表 ==========
function renderReport(){
  renderHistory();
  renderMonth();
}

function renderHistory(){
  const list=document.getElementById('histList');
  const empty=document.getElementById('histEmpty');
  const fd=document.getElementById('filterDate').value;
  const view=fd?orders.filter(o=>{
    const d=new Date(o.ts);
    const pad=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`===fd;
  }):orders;
  document.getElementById('filterCount').textContent=fd?`筛选：${fd}（${view.length} 单）`:`共 ${orders.length} 单`;
  if(!view.length){ empty.style.display='block'; list.innerHTML=''; empty.textContent=fd?'该日期暂无订单～':'还没有提交过订单～'; }
  else{
    empty.style.display='none';
    list.innerHTML=view.map(o=>{
      const itemsTxt=o.items.map(i=>`${i.name}×${i.qty}`).join('、');
      return `<div class="hist-item">
        <div class="hi-l">
          <div class="hi-time">🕒 ${o.time}</div>
          <div class="hi-no">订单号：${o.orderNo}</div>
          <div class="hi-items">${itemsTxt}</div>
        </div>
        <div class="hi-r">
          <div class="hi-total">¥${fmt(o.total)}</div>
          <button class="exp" onclick="exportOne('${o.orderNo}')">导出</button>
        </div>
      </div>`;
    }).join('');
  }
  const todayOrders=orders.filter(o=>isToday(o.ts));
  const tCount=todayOrders.length;
  const tSales=todayOrders.reduce((s,o)=>s+o.total,0);
  const aCount=orders.length;
  const aSales=orders.reduce((s,o)=>s+o.total,0);
  document.getElementById('todayOrders').textContent=tCount;
  document.getElementById('todaySales').textContent='¥'+fmt(tSales);
  document.getElementById('allOrders').textContent=aCount;
  document.getElementById('allSales').textContent='¥'+fmt(aSales);
  renderMonth();
}

let curMonth='';
function monthKey(ts){ const d=new Date(ts); const pad=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function renderMonth(){
  const grid=document.getElementById('monthsGrid');
  const rank=document.getElementById('rankList');
  const empty=document.getElementById('monthEmpty');
  if(!orders.length){ grid.innerHTML=''; rank.innerHTML=''; empty.style.display='block'; empty.textContent='暂无订单数据～';
    document.getElementById('mOrders').textContent='0'; document.getElementById('mSales').textContent='¥0.00';
    document.getElementById('mAvg').textContent='¥0.00'; document.getElementById('mBest').textContent='—'; return; }
  empty.style.display='none';
  const months=[...new Set(orders.map(o=>monthKey(o.ts)))].sort().reverse();
  if(!curMonth || !months.includes(curMonth)) curMonth=months[0];
  grid.innerHTML=months.map(m=>{
    const mo=orders.filter(o=>monthKey(o.ts)===m);
    const sales=mo.reduce((s,o)=>s+o.total,0);
    return `<div class="month-card ${m===curMonth?'active':''}" onclick="selectMonth('${m}')">
      <div class="mc-m">${m}</div>
      <div class="mc-s">${mo.length} 单</div>
      <div class="mc-t">¥${fmt(sales)}</div>
    </div>`;
  }).join('');
  const mo=orders.filter(o=>monthKey(o.ts)===curMonth);
  const mSales=mo.reduce((s,o)=>s+o.total,0);
  const days=new Set(mo.map(o=>{const d=new Date(o.ts);return d.getDate();})).size||1;
  const agg={};
  mo.forEach(o=>o.items.forEach(i=>{
    if(!agg[i.name]) agg[i.name]={cat:i.cat,qty:0,sales:0};
    agg[i.name].qty+=i.qty; agg[i.name].sales+=i.sub;
  }));
  const ranked=Object.entries(agg).map(([n,v])=>({name:n,...v})).sort((a,b)=>b.sales-a.sales).slice(0,8);
  const max=ranked.length?ranked[0].sales:1;
  rank.innerHTML=ranked.map((r,idx)=>`
    <div class="rank-item">
      <div class="rk ${idx>2?'g':''}">${idx+1}</div>
      <div class="nm">${r.name} <small style="color:#aaa">[${r.cat}] ×${r.qty}</small></div>
      <div class="bar" style="width:${Math.max(4,Math.round(r.sales/max*70))}px;background:${idx===0?'#07c160':'#c9c2ff'}"></div>
      <div class="val">¥${fmt(r.sales)}</div>
    </div>`).join('') || '<div style="color:#888;font-size:13px">该月暂无商品</div>';
  document.getElementById('mOrders').textContent=mo.length;
  document.getElementById('mSales').textContent='¥'+fmt(mSales);
  document.getElementById('mAvg').textContent='¥'+fmt(mSales/days);
  document.getElementById('mBest').textContent=ranked.length?ranked[0].name:'—';
}
function selectMonth(m){ curMonth=m; renderMonth(); }

// ========== 店铺管理 ==========
function switchShop(id){
  if(id===curShopId) return;
  curShopId=id; localStorage.setItem(LS_CUR,id); syncCur();
  cart={}; curFilter='全部'; render(); renderDishes(); toast('已切换到：'+curShop().name);
}
function addShop(){
  const name=prompt('新店铺名称：','新店铺');
  if(!name||!name.trim()) return;
  const s={id:'shop_'+Date.now(), name:name.trim(), products:[], orders:[]};
  shops.push(s); curShopId=s.id; localStorage.setItem(LS_CUR,s.id); syncCur();
  saveShops(); cart={}; curFilter='全部'; render(); renderDishes(); toast('已创建店铺：'+s.name);
}
function delShop(id){
  if(shops.length<=1){ toast('至少保留一个店铺'); return; }
  const s=shops.find(x=>x.id===id);
  if(!confirm(`确定删除店铺「${s.name}」？\n该店铺的商品与订单将一并删除，不可恢复。`)) return;
  shops=shops.filter(x=>x.id!==id);
  if(curShopId===id){ curShopId=shops[0].id; localStorage.setItem(LS_CUR,curShopId); }
  syncCur(); saveShops(); cart={}; curFilter='全部'; render(); renderDishes(); toast('已删除店铺：'+s.name);
}

// ========== 备份 ==========
function exportBackup(){
  const data={app:'点单小程序', version:2, exportedAt:new Date().toISOString(), shops, curShopId};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='点单备份_'+Date.now()+'.json'; a.click();
  URL.revokeObjectURL(url);
  toast('已导出备份（'+shops.length+' 个店铺）');
}

function importBackup(input){
  const file=input.files[0];
  if(!file){ return; }
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      let newShops=null, newCur=null;
      if(data && Array.isArray(data.shops)){ newShops=data.shops; newCur=data.curShopId; }
      else if(data && Array.isArray(data.products)){
        newShops=[{id:'shop_default', name:'总店', products:data.products, orders:data.orders||[]}]; newCur='shop_default';
      }
      if(!newShops){ toast('备份文件格式不正确'); input.value=''; return; }
      if(!confirm(`确定用备份覆盖当前数据？\n备份含：${newShops.length} 个店铺\n（当前本地数据将被替换）`)){
        input.value=''; return;
      }
      shops=newShops;
      curShopId=(newCur && shops.find(s=>s.id===newCur))?newCur:shops[0].id;
      localStorage.setItem(LS_CUR,curShopId); syncCur(); saveShops();
      curMonth=''; curFilter='全部'; cart={}; lastOrder=null;
      render(); renderDishes();
      toast('已恢复备份数据');
    }catch(err){ toast('解析失败：文件非合法 JSON'); }
    input.value='';
  };
  r.readAsText(file);
}

// ========== CSV ==========
function clearDateFilter(){
  document.getElementById('filterDate').value='';
  renderHistory();
  toast('已显示全部日期');
}

function exportCSV(){
  if(!orders.length){ toast('暂无可导出的订单'); return; }
  let rows=[['订单号','下单时间','商品名称','种类','单价(元)','数量','小计(元)','订单合计(元)']];
  orders.forEach(o=>{
    o.items.forEach((i,idx)=>{
      rows.push([o.orderNo,o.time,i.name,i.cat,fmt(i.price),i.qty,fmt(i.sub),idx===0?fmt(o.total):'']);
    });
  });
  const esc=v=>{ v=String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  const csv='\uFEFF'+rows.map(r=>r.map(esc).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='历史订单_'+new Date().getTime()+'.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('已导出 CSV（'+orders.length+' 单）');
}

function printReceipt(){
  const area=document.getElementById('printArea');

  window.print();

function exportOrder(){
  if(!lastOrder){ toast('暂无可导出的订单'); return; }
  const pick=confirm('点击「确定」导出为 .txt 文本小票\n点击「取消」导出为 .json 数据文件');
  let content, name, type;
  if(pick){
    content=
`========== 点单小程序 订单小票 ==========\n`+
`下单时间：${lastOrder.time}\n`+
`订单号：${lastOrder.orderNo}\n`+
`----------------------------------------\n`+
lastOrder.items.map(i=>`${i.name} [${i.cat}]  x${i.qty}   ¥${fmt(i.sub)}`).join('\n')+
`\n----------------------------------------\n`+
`合计：¥${fmt(lastOrder.total)}\n`+
`========================================`;
    name='订单_'+lastOrder.orderNo+'.txt'; type='text/plain;charset=utf-8';
  }else{
    content=JSON.stringify(lastOrder,null,2);
    name='订单_'+lastOrder.orderNo+'.json'; type='application/json;charset=utf-8';
  }
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name; a.click();
  URL.revokeObjectURL(url);
  toast('已导出：'+name);
}
